<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>길안내</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px 16px; font-family: -apple-system, "Malgun Gothic", sans-serif; background: #f5f6f8; color: #111; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  p { margin: 4px 0 20px; color: #666; font-size: 14px; }
  a.btn { display: block; max-width: 360px; margin: 10px auto; padding: 14px; border-radius: 10px; font-size: 17px; font-weight: 600; text-decoration: none; }
  a.go { background: #03c75a; color: #fff; }
  a.web { background: #fff; color: #03c75a; border: 1px solid #03c75a; }
  @media (prefers-color-scheme: dark) { a.web { background: #111; } }
</style>
</head>
<body>
<h1 id="name">길안내</h1>
<p id="msg">네이버 지도 내비를 여는 중…</p>
<a class="btn go" id="go" href="#">네이버 지도 내비 시작</a>
<a class="btn web" id="web" href="https://map.naver.com/">네이버 지도에서 보기</a>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var lat = parseFloat(q.get("lat")), lng = parseFloat(q.get("lng"));
  var name = (q.get("name") || "목적지").slice(0, 40);
  var ok = isFinite(lat) && isFinite(lng) && lat > 32 && lat < 39.5 && lng > 124 && lng < 132.5;
  document.getElementById("name").textContent = name;
  if (!ok) {
    document.getElementById("msg").textContent = "목적지 좌표가 없습니다.";
    document.getElementById("go").style.display = "none";
    return;
  }
  var qs = "dlat=" + lat + "&dlng=" + lng + "&dname=" + encodeURIComponent(name);
  // 경유지 v1~v5 (네이버 지도 URL Scheme 경로 탐색 공통 파라미터)
  var vias = [];
  for (var i = 1; i <= 5; i++) {
    var vlat = parseFloat(q.get("v" + i + "lat")), vlng = parseFloat(q.get("v" + i + "lng"));
    if (!(isFinite(vlat) && isFinite(vlng) && vlat > 32 && vlat < 39.5 && vlng > 124 && vlng < 132.5)) break;
    var vname = (q.get("v" + i + "name") || ("경유지" + i)).slice(0, 40);
    qs += "&v" + i + "lat=" + vlat + "&v" + i + "lng=" + vlng + "&v" + i + "name=" + encodeURIComponent(vname);
    vias.push(vname);
  }
  qs += "&appname=io.github.manwol0318.nav";
  if (vias.length) document.getElementById("name").textContent = vias.join(" → ") + " → " + name;
  var scheme = "nmap://navigation?" + qs;
  var ua = navigator.userAgent;
  var android = /Android/i.test(ua);
  var mobile = android || /iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
  // 컴퓨터 = 네이버 지도 웹 길찾기(목적지 좌표로, 네이버가 새 주소로 넘겨 줌)
  var web = "https://map.naver.com/index.nhn?elng=" + lng + "&elat=" + lat +
            "&etext=" + encodeURIComponent(name) + "&menu=route&pathType=0";
  var url = android
    ? "intent://navigation?" + qs + "#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end"
    : scheme;
  document.getElementById("web").href = web;
  if (!mobile) {
    // 컴퓨터: 브라우저 위치(허용 시)를 출발지로, 못 받으면 목적지만 (재필님 11-20 "출발지는 안뜨네")
    document.getElementById("msg").textContent = "내 위치를 확인하는 중… (위치 허용을 물으면 '허용')";
    document.getElementById("go").href = web;
    document.getElementById("go").textContent = "네이버 지도 길찾기 열기";
    document.getElementById("web").style.display = "none";
    var went = false;
    var open = function (u) { if (went) return; went = true; document.getElementById("go").href = u; location.href = u; };
    // 허용 전(prompt)이면 Chrome 이 주소창 위치 아이콘으로 조용히 물을 수 있어 30초 기다림, 허용돼 있으면 바로
    var ask = function (wait) {
      var timer = setTimeout(function () { open(web); }, wait);
      navigator.geolocation.getCurrentPosition(function (p) {
        clearTimeout(timer);
        open(web + "&slng=" + p.coords.longitude.toFixed(6) + "&slat=" + p.coords.latitude.toFixed(6) +
             "&stext=" + encodeURIComponent("내 위치"));
      }, function () { clearTimeout(timer); open(web); }, { enableHighAccuracy: false, timeout: wait - 1000, maximumAge: 600000 });
    };
    if (!navigator.geolocation) { open(web); return; }
    var start = function (state) {
      if (state === "denied") { open(web); return; }
      if (state === "prompt") document.getElementById("msg").textContent =
        "위치 허용을 물어요 — 창 위 팝업이나 주소창 오른쪽 위치 아이콘에서 '허용'을 누르세요. (30초 뒤엔 목적지만으로 열림)";
      ask(state === "granted" ? 10000 : 30000);
    };
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: "geolocation" }).then(function (s) { start(s.state); }, function () { start("prompt"); });
    } else start("prompt");
    return;
  }
  document.getElementById("go").href = url;
  setTimeout(function () { location.href = url; }, 300);
  setTimeout(function () { document.getElementById("msg").textContent = "자동으로 안 열리면 아래 초록 버튼을 누르세요."; }, 2500);
})();
</script>
</body>
</html>
